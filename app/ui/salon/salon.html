<div class="page gallery-page">

  <div class="page-head sticky-head" ma-sticky-head>
    <nav class="crumbs" aria-label="Fil d'Ariane">
      <a href="#/salons">Salons</a>
    </nav>
    <h1 class="page-title">Salon {{annee}}</h1>
    <div class="actions">
      <a class="btn btn--secondary" ng-if="ccc" href="http://www.classiccarcatalogue.com/{{annee}}.html" target="_blank" rel="noopener"><i ma-icon="external"></i>Classic Car Catalogue</a>
      <a class="btn btn--secondary mono" ng-if="prev" href="#/salon/{{prev}}"><i ma-icon="chevron-left"></i>{{prev}}</a>
      <a class="btn btn--secondary mono" ng-if="next" href="#/salon/{{next}}">{{next}}<i ma-icon="chevron-right"></i></a>
    </div>
  </div>

  <div deckgrid source="photos" cardTemplate="app/ui/salon/card.html" class="deckgrid"></div>

</div>
