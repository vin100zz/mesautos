<div class="page">

  <div class="page-head sticky-head" ma-sticky-head>
    <h1 class="page-title">Nouveautés</h1>
  </div>

  <div class="decennies">
    <div class="decennie" ng-repeat="d in decennies track by d.decennie">
      <div class="decennie__label">{{::d.decennie}}</div>
      <div class="decennie__annees">
        <span ng-repeat="a in d.annees track by a.annee" class="decennie__cell">
          <a ng-if="::a.avec" class="decennie__annee" href="#/annee/{{::a.annee}}">{{::a.annee}}</a>
          <span ng-if="::!a.avec && !a.futur" class="decennie__annee is-empty">{{::a.annee}}</span>
        </span>
      </div>
    </div>
  </div>

</div>
