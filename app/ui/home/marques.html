<div class="page">

  <div class="page-head sticky-head" ma-sticky-head>
    <h1 class="page-title">Marques</h1>
    <nav class="az" aria-label="Index alphabétique" ma-scroll-spy>
      <button type="button" class="az__letter" ng-repeat="l in letters" data-spy="lettre-{{l}}" ng-disabled="!hasLetter[l]" ng-click="scrollTo(l)">{{l}}</button>
    </nav>
    <button type="button" class="btn btn--primary" ng-click="openSaisie('add', 'marque')"><i ma-icon="plus"></i>Ajouter une marque</button>
  </div>

  <div class="marques">

    <aside class="pays-filter" aria-label="Filtrer par pays">
      <div class="pays-filter__head">
        <h2 class="label">Pays</h2>
        <div>
          <button type="button" class="btn-text" ng-click="selectAll()">Tous</button>
          <button type="button" class="btn-text" ng-click="selectNone()">Aucun</button>
        </div>
      </div>
      <ul class="pays-filter__list">
        <li class="pays-filter__item" ng-repeat="p in pays track by p.code" ng-class="{'is-on': p.filter}">
          <button type="button" class="pays-filter__check" ng-click="toggleFilter(p)" aria-pressed="{{p.filter}}" aria-label="Inclure {{p.nom}}">
            <span class="check" ng-class="{'is-on': p.filter}"><i ma-icon="check"></i></span>
          </button>
          <button type="button" class="pays-filter__name" ng-click="selectFilter(p.code)" title="{{p.nom}}">
            <img class="flag" ng-src="{{p.flag}}" alt="">
            <span>{{p.nom}}</span>
          </button>
        </li>
      </ul>
    </aside>

    <div class="marques__content">
      <div class="empty" ng-if="loaded && !sections.length">Aucune marque</div>
      <section class="letter-section" ng-repeat="s in sections track by s.letter" id="lettre-{{s.letter}}">
        <h2 class="section-title">{{s.letter}}</h2>
        <div class="brand-grid">
          <a class="brand" ng-repeat="m in s.items track by m.idMarque" href="#/marque/{{::m.idMarque}}">
            <span class="logo-tile" data-img-host>
              <img loading="lazy" ng-src="{{::m.logo}}" alt="" ma-img-fallback>
              <span class="logo-tile__initials">{{::m.initials}}</span>
            </span>
            <span class="brand__name">{{::m.nomMarque}}</span>
            <span class="brand__meta">
              <img ng-if="::m.flag" class="flag" ng-src="{{::m.flag}}" alt="{{::m.paysNom}}">
              <span>{{::m.annees}}</span>
            </span>
          </a>
        </div>
      </section>
    </div>

  </div>
</div>
