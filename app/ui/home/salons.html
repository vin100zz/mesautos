<div class="page">

  <div class="page-head sticky-head" ma-sticky-head>
    <h1 class="page-title">Salons</h1>
  </div>

  <div class="year-grid">
    <a class="year-tile" ng-repeat="salon in salons track by salon.annee" href="#/salon/{{::salon.annee}}" data-img-host>
      <img loading="lazy" ng-src="{{::salon.mini}}" alt="" ma-img-fallback>
      <span class="photo-missing"><i ma-icon="image"></i></span>
      <span class="year-tile__label">{{::salon.annee}}</span>
    </a>
  </div>

</div>
