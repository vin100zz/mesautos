<div class="page">

  <div class="page-head">
    <h1 class="page-title">Miniatures</h1>
    <div class="segmented" role="group" aria-label="Afficher">
      <button type="button" ng-repeat="f in filtres" ng-class="{'is-on': filtre === f.id}" aria-pressed="{{filtre === f.id}}" ng-click="setFiltre(f.id)">{{f.label}}</button>
    </div>
  </div>

  <div class="mini-list">
    <section class="mini-brand" ng-repeat="marque in miniatures.marques track by marque.idMarque">
      <button type="button" class="mini-brand__head" ng-click="toggleMarque(marque)" aria-expanded="{{isExpanded(marque)}}">
        <span class="logo-tile logo-tile--sm" data-img-host>
          <img ng-src="{{logo(marque.idMarque)}}" alt="" ma-img-fallback>
          <span class="logo-tile__initials">{{initials(marque.nomMarque)}}</span>
        </span>
        <span class="mini-brand__name">{{marque.nomMarque}}</span>
        <i ma-icon="chevron-right" class="mini-brand__chevron" ng-class="{'is-open': isExpanded(marque)}"></i>
      </button>
      <ul class="mini-brand__models" ng-if="isExpanded(marque)">
        <li ng-repeat="modele in marque.modeles | filter: filtreModele track by modele.idModele">
          <button type="button" role="checkbox" class="mini-model" ng-class="{'is-on': modele.mini === 'Y'}" aria-checked="{{modele.mini === 'Y'}}" ng-click="toggleMini(modele)">
            <span class="check"><i ma-icon="check"></i></span>
            <span class="mini-model__name">{{nom(modele)}}</span>
            <span class="mini-model__year mono">{{annee(modele)}}</span>
          </button>
        </li>
      </ul>
    </section>
  </div>

</div>
