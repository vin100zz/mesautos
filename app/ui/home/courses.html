<div class="page">

  <div class="page-head">
    <h1 class="page-title">Courses</h1>
  </div>

  <section class="course-section" ng-repeat="course in courses track by course.nom">
    <h2 class="section-title">{{::course.nom | courseFilter}}</h2>
    <div class="year-grid">
      <a class="year-tile" ng-repeat="a in course.annees track by a.annee" href="#/course/{{::course.nom}}/{{::a.annee}}" data-img-host>
        <img loading="lazy" ng-src="{{::a.image}}" alt="" ma-img-fallback>
        <span class="photo-missing"><i ma-icon="image"></i></span>
        <span class="year-tile__label">{{::a.annee}}</span>
      </a>
    </div>
  </section>

</div>
