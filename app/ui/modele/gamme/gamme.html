<section class="gamme" ng-if="cfg.gamme">

  <div class="gamme-head">
    <h2 class="gamme-title">
      {{cfg.gamme.nom || (cfg.gamme.type | categorieType) || '…'}}
      <span class="gamme-title__type" ng-if="cfg.gamme.nom && cfg.gamme.type">{{cfg.gamme.type | categorieType}}</span>
    </h2>
    <div class="actions">
      <button type="button" class="btn btn--secondary btn--sm" ng-click="openSaisie('edit', 'gamme', cfg.gamme.idGamme)"><i ma-icon="edit"></i>Modifier la gamme</button>
      <button type="button" class="btn btn--primary btn--sm" ng-click="openSaisie('add', 'docGamme', cfg.gamme.idGamme)"><i ma-icon="plus"></i>Ajouter un document</button>
    </div>
  </div>

  <div class="gamme-histo histo histo--note" ng-if="cfg.gamme.histo" ng-bind-html="cfg.gamme.histo"></div>

  <div deckgrid source="photos" cardTemplate="app/ui/modele/gamme/card.html" class="deckgrid"></div>

</section>
