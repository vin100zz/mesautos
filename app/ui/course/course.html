<div class="page gallery-page">

  <nav class="crumbs" aria-label="Fil d'Ariane">
    <a href="#/courses">Courses</a>
  </nav>

  <div class="page-head sticky-head" ma-sticky-head>
    <h1 class="page-title">{{nom | courseFilter}} {{annee}}</h1>
    <div class="actions">
      <a class="btn btn--secondary mono" ng-if="prev" href="#/course/{{nom}}/{{prev}}"><i ma-icon="chevron-left"></i>{{prev}}</a>
      <a class="btn btn--secondary mono" ng-if="next" href="#/course/{{nom}}/{{next}}">{{next}}<i ma-icon="chevron-right"></i></a>
    </div>
  </div>

  <div deckgrid source="photos" cardTemplate="app/ui/course/card.html" class="deckgrid"></div>

</div>
